<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- Menambahkan batasan zoom agar lebih responsif seperti aplikasi asli -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Sistem Informasi</title>
  <link rel="icon" href="https://drive.google.com/file/d/1ApbjlJnECGIPKrEc__rEUvB4hzQhKN-S/view?usp=sharing" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
      overscroll-behavior-y: none; /* Mencegah pull-to-refresh di browser mobile */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbz1CL_TbgJwv_NA1fGuef5kSZG0s5ZtGG7nRkF0RXC-CuceCCz5mWNp7tIugf36_yfnpg/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="camera *; microphone *; fullscreen; display-capture; geolocation">
    </iframe>
  </div>
</body>
</html>
